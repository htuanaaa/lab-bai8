global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  # Thay đổi theo kênh bạn muốn

receivers:
  - name: 'default'
    slack_configs:
      - api_url: '#####URL######'
        channel: '#alert'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
